name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install (CPU torch)
        run: |
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
          # failing tests become GitHub annotations: readable in the UI and via the public API
          pip install pytest-github-actions-annotate-failures
      - name: Tests
        run: |
          set -o pipefail
          pytest -q -rfE --tb=short -W ignore::FutureWarning 2>&1 | tee pytest.log
      - name: Surface pytest summary as annotations
        # Job logs need a login to read; annotations are public (also via the REST API).
        if: failure()
        shell: python
        run: |
          lines = open("pytest.log", encoding="utf-8", errors="replace").read().splitlines()
          keep = [l for l in lines if l.startswith(("FAILED", "ERROR", "E ")) or "Error" in l][:80]
          esc = lambda l: l.replace("%", "%25").replace("::", ": :")
          body = "%0A".join(esc(l) for l in keep + ["---- tail ----"] + lines[-40:])
          print(f"::error title=pytest summary::{body}")

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v5
      - name: Build serving image (empty model dir; the real bundle ships to the Space)
        run: |
          mkdir -p deploy/model
          docker build -t defectlens:ci .
      - name: Image imports without torch
        run: >
          docker run --rm defectlens:ci
          python -c "import sys, app.main; assert 'torch' not in sys.modules; print('ok')"
