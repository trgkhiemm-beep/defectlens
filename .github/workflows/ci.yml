name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install (CPU torch)
        run: |
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
      - name: Tests
        run: pytest -q -W ignore::FutureWarning

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build serving image (empty model dir; the real bundle ships to the Space)
        run: |
          mkdir -p deploy/model
          docker build -t defectlens:ci .
      - name: Image imports without torch
        run: >
          docker run --rm -e DEFECTLENS_NO_AUTOLOAD=1 defectlens:ci
          python -c "import sys, app.main; assert 'torch' not in sys.modules; print('ok')"
