# DefectLens data config.
# Augmentation is CATEGORY-AWARE on purpose: in anomaly detection, an augmentation
# that is harmless for classification can turn a normal sample into a "defect".
#   - metal_nut: the "flip" defect IS a mirrored nut -> horizontal flip forbidden.
#   - capsule:   printed "500" text -> any flip creates mirrored text (abnormal).
#   - transistor:"misplaced" defect = rotated/shifted part -> no rotation.
#   - carpet:    stationary texture -> flips/rot90 are safe.

image_size: 256
val_ratio: 0.1          # fraction of train/good held out for threshold selection
synthetic_per_category: 60
seed: 42

categories:
  transistor:
    industry: electronics
    foreground: false
    augment: {hflip: false, vflip: false, rot90: false, max_rotate: 0}
  capsule:
    industry: pharmaceutical
    foreground: true
    augment: {hflip: false, vflip: false, rot90: false, max_rotate: 2}
  metal_nut:
    industry: mechanical
    foreground: true
    augment: {hflip: false, vflip: false, rot90: false, max_rotate: 0}
  carpet:
    industry: textile
    foreground: false
    augment: {hflip: true, vflip: true, rot90: true, max_rotate: 0}
